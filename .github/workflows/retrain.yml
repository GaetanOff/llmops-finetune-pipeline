name: Retrain Model on Data Change

on:
  push:
    paths:
      - 'data/**'
      - 'configs/model_config.yaml'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[retrain]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull DVC data
        run: |
          dvc pull
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Generate sample dataset
        run: |
          python -m src.data.data_generator

      - name: Run training
        run: |
          python scripts/train.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Push model with DVC
        run: |
          dvc add models/checkpoints/final_model
          dvc push
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Commit DVC changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add models/checkpoints/final_model.dvc .dvc/config
          git commit -m "Update model [skip ci]" || echo "No changes to commit"
          git push
